name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Installs exactly the toolchain pinned in rust-toolchain.toml — the same
      # compiler a developer gets locally, so clippy can't find something here
      # that it didn't find there.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # The checks themselves live in scripts/check.sh, which the pre-commit
      # hook also runs, so the two can never drift apart.
      - name: Clippy, tests, release build
        run: ./scripts/check.sh --full
